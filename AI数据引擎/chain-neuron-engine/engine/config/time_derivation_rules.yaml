# 时间派生规则（表单生成；保存后自动热更新）
# 节气预置采用可编辑的日期窗口，不宣称天文时刻级精度；如业务有更高精度要求，
# 请在时间规则生成器中替换为经过确认的日历服务结果。
version: 5
time_derivations:
  - name: "season"
    source: "month"
    mapping:
      "3,4,5": "春季"
      "6,7,8": "夏季"
      "9,10,11": "秋季"
      "12,1,2": "冬季"
  - name: "week"
    source: "iso_week"
    precision: "day"
  - name: "quarter"
    source: "month"
    mapping:
      "1,2,3": "Q1"
      "4,5,6": "Q2"
      "7,8,9": "Q3"
      "10,11,12": "Q4"
  - name: "half_year"
    source: "month"
    mapping:
      "1,2,3,4,5,6": "上半年"
      "7,8,9,10,11,12": "下半年"
  - name: "month_parity"
    source: "month"
    mapping:
      "1,3,5,7,9,11": "单月"
      "2,4,6,8,10,12": "双月"
  - name: "weekday_type"
    source: "weekday"
    precision: "day"
    mapping:
      "0,1,2,3,4": "工作日"
      "5,6": "周末"
  - name: "holiday"
    source: "date"
    precision: "day"
    rules:
      - condition: "month=11 and day>=25 and day<=30"
        value: "黑色星期五"
      - condition: "month=6 and day>=15 and day<=20"
        value: "618大促"
      - condition: "month=11 and day=11"
        value: "双11"
  - name: "solar_term"
    source: "date"
    precision: "day"
    rules:
      - condition: "month=1 and day>=5 and day<=6"
        value: "小寒"
      - condition: "month=1 and day>=20 and day<=21"
        value: "大寒"
      - condition: "month=2 and day>=3 and day<=5"
        value: "立春"
      - condition: "month=2 and day>=18 and day<=20"
        value: "雨水"
      - condition: "month=3 and day>=5 and day<=6"
        value: "惊蛰"
      - condition: "month=3 and day>=20 and day<=21"
        value: "春分"
      - condition: "month=4 and day>=4 and day<=5"
        value: "清明"
      - condition: "month=4 and day>=19 and day<=20"
        value: "谷雨"
      - condition: "month=5 and day>=5 and day<=6"
        value: "立夏"
      - condition: "month=5 and day>=20 and day<=21"
        value: "小满"
      - condition: "month=6 and day>=5 and day<=6"
        value: "芒种"
      - condition: "month=6 and day>=21 and day<=22"
        value: "夏至"
      - condition: "month=7 and day>=6 and day<=8"
        value: "小暑"
      - condition: "month=7 and day>=22 and day<=23"
        value: "大暑"
      - condition: "month=8 and day>=7 and day<=8"
        value: "立秋"
      - condition: "month=8 and day>=22 and day<=23"
        value: "处暑"
      - condition: "month=9 and day>=7 and day<=8"
        value: "白露"
      - condition: "month=9 and day>=22 and day<=23"
        value: "秋分"
      - condition: "month=10 and day>=8 and day<=9"
        value: "寒露"
      - condition: "month=10 and day>=23 and day<=24"
        value: "霜降"
      - condition: "month=11 and day>=7 and day<=8"
        value: "立冬"
      - condition: "month=11 and day>=22 and day<=23"
        value: "小雪"
      - condition: "month=12 and day>=6 and day<=8"
        value: "大雪"
      - condition: "month=12 and day>=21 and day<=23"
        value: "冬至"
  - name: "week_relative_period"
    source: "date"
    precision: "day"
    rules:
      - condition: "date belongs to current calendar week"
        value: "本周"
      - condition: "date belongs to previous calendar week"
        value: "上周"
      - condition: "date belongs to next calendar week"
        value: "下周"
  - name: "day"
    source: "day"
    precision: "day"
