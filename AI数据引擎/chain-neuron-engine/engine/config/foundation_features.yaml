global_semantics:
  principle: 基座只负责语义过滤、翻译、归一化、纠偏和派生条件，不承载原始时间序列，也不替代事实数据集字段。
  experience_file: engine/config/ai_field_recommendations.yaml
  time_policy: 原始时间序列默认属于中通主干；季节、节日、同比、环比等由基座翻译为可执行条件
  common_time_semantics:
    本周: 当前周周一至今天
    上周: 上一完整自然周（周一至周日）
    本月: 当月第一天至今天
    上月: 上一完整自然月
    同比: 上一年度相同日期/期间
    环比: 紧邻上一完整同粒度期间
