# AI 字段分析常用推荐库
#
# 这是项目经验资产，不属于业务数据：注销数据集、清空业务表和重初始化均不得删除本文件。
# 修正推荐时追加新 revision 或将旧条目标记为 retired，不复用 id、不物理删除历史条目。
version: 2
catalog: ai_field_recommendations
updated_at: 2026-10-03
# 查询经验与字段推荐共用此版本化资产；业务数据注销、清库和重初始化不得删除。
# 这些规则是查询规划建议，不替代注册数据集声明，也不直接修改事实表。
base_semantics:
  version: 1
  principle: 基座只负责语义过滤、翻译、归一化、纠偏和派生条件，不承载原始时间序列，也不替代事实数据集字段。
  field_layer_policy:
    time: 时间字段默认进入通用事实的中通主干；只有用户确认其具备公共语义翻译价值时，才允许额外复用到基座。
    dimension: 普通维度默认进入中通主干；产品、组织、类别和别名只有在经验库或 AI 明确建议且人工确认后才进入基座。
    metric: 指标默认进入中通分枝，不得作为基座过滤字段。
    ignore: 空字段、技术字段和审计字段默认不进入任何结构层。
  semantic_translation:
    purpose: 将自然语言中的业务概念转换为注册数据集能够执行的标准条件或值集合。
    time_period:
      examples: [上半年, 下半年, 春季, 夏季, 秋季, 冬季, 双十一, 黑色星期五, 超级星期六, 春节, 端午节, 国庆]
      rule: 时间字段仍由通用事实主干承载；上述词语由基座翻译为月份集合、日历映射或数据集声明的季节值。
    product_alias:
      examples: [类别甲, 类别乙, 类别代码甲, 类别代码丙, 类别代码丁]
      rule: 基座优先通过已确认的产品编码、产品名称、类别和别名特征完成纠偏与多值映射，不把行业字段名称硬编码为查询层级。
    comparison:
      yoy: 当前期间与上一年度同一期间比较；例如 2026年5月对比 2025年5月。
      mom: 当前期间与紧邻上一个期间比较；例如 2026年5月对比 2026年4月。
      completion_rate: 实际值除以计划值；分母为零或缺失时返回不可计算并保留审计告警。
  dataset_scope:
    actual_sales:
      include_kinds: [generic]
      exclude_terms: [计划, 指标, 预算, plan]
      rule: 未明确指定业务类型时，“业务”查询覆盖当前启用的全部通用事实数据集；维表/主数据和计划类数据不自动纳入。
      rationale: 新数据集注册后只要声明为通用事实并通过启用状态校验，即可自动进入跨数据集业务查询。
  time_comparisons:
    yoy:
      label: 同比
      definition: 当前期间与上一年度同一期间比较；2026年5月的同比基准是2025年5月。
      shift: {years: -1, months: 0}
      output: 当前值、同比基准值、差额和变化率。
    mom:
      label: 环比
      definition: 当前期间与紧邻上一个期间比较；2026年5月的环比基准是2026年4月。
      shift: {years: 0, months: -1}
      output: 当前值、环比基准值、差额和变化率。
  common_relative_periods:
    本周:
      kind: week
      definition: 当前自然周周一至今天；当前日期为 2026-09-28 时，本周从 2026-09-28 开始。
      layer: foundation_translation
      target: trunk_time_range
    上周:
      kind: week
      definition: 上一完整自然周，按周一至周日计算；当前日期为 2026-09-28 时，上周为 2026-09-21 至 2026-09-27。
      layer: foundation_translation
      target: trunk_time_range
    本月:
      kind: month
      definition: 当月第一天至今天。
      layer: foundation_translation
      target: trunk_time_range
    上月:
      kind: month
      definition: 上一完整自然月。
      layer: foundation_translation
      target: trunk_time_range
    selection_rule:
      rule: 只从数据集声明的 canonical_time 时间入口中选择字段；不能把组织、商品、记录、指标或审计字段作为上周/本周候选。
      precision: 只有 yyyymmdd 或 d/m/yyyy 日粒度才能精确执行周范围；yyyymm/yyyy-mm 只能回答月粒度，必须提示能力不足。
      default: 相对时间语义默认由基座翻译，原始时间字段默认进入中通主干，不写入基座 dataset_bindings。
  time_query_contract:
    raw_time_owner: trunk
    semantic_translator: foundation
    comparison_rule: 同比使用上一年度相同日期范围，环比使用紧邻上一完整同粒度范围；周查询的环比是上一周，不是上一月。
    audit_required: true
  business_aggregates:
    oil_machine_output:
      label: 指定类别合计
      aliases: [指定类别合计, 指定类别合计, 指定类别合计业务数量]
      datasets: [oil_sales_daily]
      metric: salesvol
      components:
        - {label: 类别甲, base_filter: {product: 类别甲}, compiled_condition: {category: '01'}}
        - {label: 类别乙, base_filter: {product: 类别乙}, compiled_condition: {category: '02'}}
      combined_base_filter: {product: [类别甲, 类别乙]}
      combined_condition: {category: ['01', '02']}
      rule: 指定类别合计只汇总类别甲与类别乙；类别丁、类别戊和空分类不自动纳入。必须由引擎在相同时间、组织及其他条件下聚合，模型不得使用未过滤的全品类总额或自行加减。
      source: project_experience
      status: active
      added_at: 2026-10-03
      revision: 1
  semantic_filters:
    location:
      slot: organization
      semantic_types: [org_name, org_code]
      rule: 地点语义先进入通用基座，再在每个目标数据集声明的组织名称/组织编码特征中解析为实际值；不得把示例区域甲固定映射为某个行业字段。
      example: 示例区域甲可分别解析为产品数据集的示例区域甲组织层级一，以及业务域乙数据集声明的示例区域甲组织/地域值。
      rationale: 同一个自然语言地点在不同数据集的物理字段和编码可能不同，必须按数据集特征契约分别翻译。
